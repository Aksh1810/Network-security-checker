<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanning...</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0d1117',
                        surface: '#161b22',
                        border: '#30363d',
                        accent: '#00ff88',
                        primary: '#e6edf3',
                        muted: '#8b949e',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'Consolas', 'monospace'],
                    },
                }
            }
        }
    </script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { animation: blink 1s step-end infinite; }

        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.35); }
            70%  { box-shadow: 0 0 0 16px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
        .pulse-ring { animation: pulse-ring 2s ease-out infinite; }
    </style>
</head>
<body class="bg-base text-primary font-mono min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-2xl font-bold tracking-widest">
                <span class="text-accent">[</span>NHC<span class="text-accent">]</span>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-surface border border-border rounded-lg p-8 text-center">

            <!-- Spinner -->
            <div class="flex items-center justify-center mb-6">
                <div class="pulse-ring w-16 h-16 rounded-full flex items-center justify-center">
                    <div class="w-12 h-12 rounded-full border-4 border-border border-t-accent animate-spin"></div>
                </div>
            </div>

            <!-- Scan type badge -->
            <div class="inline-block px-3 py-1 rounded-full border border-accent/40 text-accent text-xs uppercase tracking-widest mb-5">
                {{ scan_type }} scan
            </div>

            <!-- Terminal line -->
            <div class="bg-base rounded px-4 py-3 text-left mb-5 border border-border">
                <span class="text-muted text-xs">$</span>
                <span class="text-accent text-sm ml-2">nmap {{ ip }}<span class="cursor">_</span></span>
            </div>

            <p class="text-muted text-xs leading-relaxed mb-4">
                This may take a few minutes. Do not close this tab.
            </p>

            <!-- Cancel button -->
            <button
                id="cancel-btn"
                onclick="cancelScan()"
                class="px-4 py-2 border border-red-800 text-red-400 text-xs rounded hover:bg-red-900/20 transition-colors cursor-pointer"
            >
                ✕ Cancel Scan
            </button>
        </div>

        <p class="text-center text-muted/50 text-xs mt-4 tracking-widest">
            CHECKING STATUS EVERY 3s
        </p>

    </div>

    <script>
        const scanId = "{{ scan_id }}";

        async function poll() {
            try {
                const res  = await fetch(`/scan/${scanId}/status`);
                const data = await res.json();
                if (data.status !== 'running') {
                    window.location.href = `/scan/${scanId}`;
                }
            } catch (_) {
                // network hiccup — keep polling
            }
        }
        setInterval(poll, 3000);

        async function cancelScan() {
            const btn = document.getElementById('cancel-btn');
            btn.textContent = 'Cancelling…';
            btn.disabled = true;
            try {
                await fetch(`/scan/${scanId}/cancel`, { method: 'POST' });
            } catch (_) {}
            window.location.href = `/scan/${scanId}`;
        }
    </script>
</body>
</html>
