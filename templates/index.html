<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Health Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0d1117',
                        surface: '#161b22',
                        border: '#30363d',
                        accent: '#00ff88',
                        'accent-dim': '#00cc6a',
                        primary: '#e6edf3',
                        muted: '#8b949e',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'Consolas', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        .scan-card input[type="radio"] { display: none; }
        .scan-card:has(input:checked) {
            border-color: #00ff88;
            background-color: #0d2a1a;
        }
        .scan-card:has(input:checked) .card-dot {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        .scan-card:has(input:checked) .card-title { color: #00ff88; }

        input[type="text"]:focus { outline: none; box-shadow: 0 0 0 2px #00ff88; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { animation: blink 1s step-end infinite; }
    </style>
</head>
<body class="bg-base text-primary font-mono min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8 relative">
            <a href="/history" class="absolute right-0 top-1 text-muted hover:text-primary text-xs transition-colors">[history]</a>
            <div class="text-3xl font-bold tracking-widest">
                <span class="text-accent">[</span>NHC<span class="text-accent">]</span>
            </div>
            <p class="text-muted text-sm mt-1 tracking-wider">NETWORK HEALTH CHECKER</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 px-4 py-3 rounded border border-yellow-600 bg-yellow-900/30 text-yellow-300 text-sm">
            <span class="text-yellow-500">⚠</span> {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Card -->
        <div class="bg-surface border border-border rounded-lg p-6">

            <form method="POST">

                <!-- Target input -->
                <div class="mb-5">
                    <label class="block text-xs text-muted uppercase tracking-widest mb-2">Target</label>
                    <div class="flex items-center bg-base border border-border rounded px-3 py-2 gap-2 transition-all">
                        <span class="text-accent text-sm select-none">$</span>
                        <input
                            type="text"
                            id="ip"
                            name="ip"
                            placeholder="192.168.1.1 or domain.com"
                            required
                            class="flex-1 bg-transparent text-primary placeholder-muted text-sm focus:outline-none"
                        >
                    </div>
                    {% if user_ip %}
                    <div class="mt-2 flex items-center gap-2 text-xs text-muted">
                        <span>Detected:</span>
                        <code class="text-accent/80">{{ user_ip }}</code>
                        <button
                            type="button"
                            onclick="document.getElementById('ip').value = '{{ user_ip }}'"
                            class="text-accent hover:text-accent-dim underline underline-offset-2 transition-colors"
                        >use this</button>
                    </div>
                    {% endif %}
                </div>

                <!-- Scan type -->
                <div class="mb-6">
                    <label class="block text-xs text-muted uppercase tracking-widest mb-3">Scan Mode</label>
                    <div class="flex flex-col gap-2">

                        <label class="scan-card flex items-start gap-3 bg-base border border-border rounded p-3 cursor-pointer transition-all duration-150">
                            <input type="radio" name="scan_type" value="network" checked>
                            <span class="card-dot mt-1 w-2.5 h-2.5 rounded-full bg-border flex-shrink-0 transition-all duration-150"></span>
                            <div>
                                <div class="card-title text-sm font-bold text-primary transition-colors duration-150">Network Device Scan</div>
                                <div class="text-xs text-muted mt-0.5">Deep vulnerability scan of all services via Nmap. Slow but thorough.</div>
                            </div>
                        </label>

                        <label class="scan-card flex items-start gap-3 bg-base border border-border rounded p-3 cursor-pointer transition-all duration-150">
                            <input type="radio" name="scan_type" value="web">
                            <span class="card-dot mt-1 w-2.5 h-2.5 rounded-full bg-border flex-shrink-0 transition-all duration-150"></span>
                            <div>
                                <div class="card-title text-sm font-bold text-primary transition-colors duration-150">Website &amp; App Scan</div>
                                <div class="text-xs text-muted mt-0.5">Checks SSL, HTTP headers, and common web vulnerabilities on ports 80/443.</div>
                            </div>
                        </label>

                        <label class="scan-card flex items-start gap-3 bg-base border border-border rounded p-3 cursor-pointer transition-all duration-150">
                            <input type="radio" name="scan_type" value="specialty">
                            <span class="card-dot mt-1 w-2.5 h-2.5 rounded-full bg-border flex-shrink-0 transition-all duration-150"></span>
                            <div>
                                <div class="card-title text-sm font-bold text-primary transition-colors duration-150">Quick Security Check</div>
                                <div class="text-xs text-muted mt-0.5">Fast audit of top 100 ports. Best for a quick security posture overview.</div>
                            </div>
                        </label>

                    </div>
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="w-full bg-accent hover:bg-accent-dim text-base font-bold py-3 rounded tracking-widest uppercase text-sm transition-colors duration-150 cursor-pointer"
                >
                    ▶ Run Scan
                </button>

            </form>
        </div>

        <p class="text-center text-muted text-xs mt-4">
            Scans typically take 2–5 minutes<span class="cursor">_</span>
        </p>

    </div>
</body>
</html>
